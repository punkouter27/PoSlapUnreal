name: Deploy web version to Azure Static Web Apps

on:
  push:
    branches: [master]
    paths:
      - "Web/**"
      - "training/models/**"
      - "training/characters/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull LFS assets the bundle needs (brains + GLBs)
        run: git lfs pull --include="training/models/brains/*.onnx,Web/assets/*.glb"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install web dependencies
        working-directory: Web
        run: npm ci

      - name: Bundle static site
        run: python Web/build.py

      - name: Test the browser engine (one turn each way, every pairing)
        run: for p in gg kk gk; do node Web/check.mjs $p; done

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POSLAP_ARENA }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: Web/dist
