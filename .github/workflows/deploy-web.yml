name: Deploy web version to Azure Static Web Apps

on:
  push:
    branches: [master]
    paths:
      - "Web/**"
      - "training/models/**"
      - "training/characters/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # pinned to commit SHAs: the deploy token goes to these actions, so a moved tag must not change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull LFS assets the bundle needs (brains + GLBs)
        run: git lfs pull --include="training/models/brains/*.onnx,Web/assets/*.glb"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install web dependencies
        working-directory: Web
        run: npm ci

      - name: Bundle static site
        run: python Web/build.py

      - name: Test the browser engine (one turn each way, every pairing)
        run: for p in gg kk gk; do node Web/check.mjs $p; done

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POSLAP_ARENA }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: Web/dist
