name: Build & Deploy

# The one workflow for this repo: verify the three engines agree, bundle the web build, then (master
# only) deploy it to the Azure Static Web App. Pull requests get the checks and the bundle, never a
# deploy. Nothing here needs a GPU: verify_realism.py (the CUDA env checks) stays a local gate.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # A newer PR run may replace an older one; a master deploy is never cancelled part-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # pinned to commit SHAs: the deploy token goes to these actions, so a moved tag must not change what runs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pull LFS assets the bundle and checks need (brains, GLBs, audio, textures)
        run: git lfs pull --include="training/models/brains/*.onnx,Web/assets/*.glb,Web/assets/audio/*.wav,Web/assets/tex/*"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install the web dependencies
        working-directory: Web
        run: npm ci

      # ---- Verify ----

      - name: Browser engine (one turn each way, every pairing)
        run: for p in gg kk gk; do node Web/check.mjs $p; done

      - name: Live relay (the publisher key is enforced)
        run: node Web/live_check.mjs

      - name: Spectator API
        run: if [ -f Web/api_check.mjs ]; then node Web/api_check.mjs; fi

      - name: Every python file parses
        run: python -m compileall -q training Web

      - name: Asset naming and folder conventions
        run: python Scripts/check_naming.py

      - name: Install the CPU simulation dependencies
        run: python -m pip install --upgrade pip && python -m pip install "mujoco==3.10.0" numpy

      - name: Character cards, models and packaged staging
        run: python training/verify_cards.py

      # constants.py + rules.json are the source; SlapShared.gen.h and Web/shared.gen.js are generated from them.
      # Fails when either copy is stale or hand-edited, or an engine types a shared number itself.
      - name: The three engines read the same numbers (generated copies current)
        run: |
          python training/gen_constants.py --check
          python training/verify_constants.py

      - name: Browser engine under rules 2 (forced on the shipped models)
        run: SLAP_RULES=2 node Web/check.mjs gk

      # The same seeded matches through match.py and sim.js, referee event for event (rules 1, rules 2, rules 2 with
      # stuns and counts). Passes on Windows (2026-11-13); not yet run on a Linux runner, where the two ONNX runtimes'
      # rounding may differ, so it reports without failing the job. Make it blocking after the first green run.
      - name: Python vs browser match parity
        continue-on-error: true
        run: |
          python -m pip install onnxruntime
          python training/parity_check.py --stun 0.55

      - name: The dev server serves only Web/ and training/
        run: |
          python Web/serve.py --port 8099 &
          sleep 2
          for path in /Web/index.html /training/models/grandpa_solo.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8099$path")
            echo "$path -> $code"
            test "$code" = "200" || { echo "expected 200 for $path"; exit 1; }
          done
          for path in /.git/config /Saved/Logs/PoSlapUnreal.log /AGENTS.md; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8099$path")
            echo "$path -> $code"
            test "$code" != "200" || { echo "$path must not be served"; exit 1; }
          done

      # ---- Build & deploy ----

      - name: Bundle static site
        run: python Web/build.py

      - name: Deploy to Azure Static Web Apps
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POSLAP_ARENA }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: Web/dist
