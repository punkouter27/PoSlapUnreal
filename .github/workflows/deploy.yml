name: Build & Deploy

# The one workflow for this repo: Python checks -> the browser-engine checks -> bundle Web/dist -> (master only) deploy
# it to the Azure Static Web App -> check the live page and /diag. Pull requests get the checks and the bundle, never
# a deploy. Nothing here needs a GPU (verify_realism.py, the CUDA env checks, stays a local gate) and the Unreal
# project is built locally (UE 5.8 is not on GitHub's runners).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # A newer PR run may replace an older one; a master deploy is never cancelled part-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # pinned to commit SHAs: the deploy token goes to these actions, so a moved tag must not change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull LFS assets the bundle and checks need (brains, GLBs, audio, textures)
        run: git lfs pull --include="training/models/brains/*.onnx,Web/assets/*.glb,Web/assets/audio/*.wav,Web/assets/tex/*"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Web/package-lock.json

      # ---- Python: lint, format, tests (MuJoCo pinned to URLab's 3.10.0, as training/requirements.txt) ----

      - name: Install the CPU Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install "mujoco==3.10.0" numpy onnxruntime pytest ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest (cards, models, generated constants, naming, a seeded match, reward config)
        run: python -m pytest -q

      # ---- Browser engine ----

      - name: Install the web dependencies
        working-directory: Web
        run: npm ci

      - name: Browser engine (one turn each way, every pairing; rules 2 forced on the shipped models)
        run: |
          for p in gg kk gk; do node Web/check.mjs $p; done
          SLAP_RULES=2 node Web/check.mjs gk

      - name: Live relay (the publisher key is enforced)
        run: node Web/live_check.mjs

      - name: Spectator API
        run: if [ -f Web/api_check.mjs ]; then node Web/api_check.mjs; fi

      # The same seeded matches through match.py and sim.js, referee event for event (rules 1, rules 2, rules 2 with
      # stuns and counts). Passes on Windows (2026-11-13); not yet run on a Linux runner, where the two ONNX runtimes'
      # rounding may differ, so it reports without failing the job. Make it blocking after the first green run.
      - name: Python vs browser match parity
        continue-on-error: true
        run: python training/parity_check.py --stun 0.55

      - name: The dev server serves only Web/ and training/
        run: |
          python Web/serve.py --port 8099 &
          sleep 2
          for path in /Web/index.html /training/models/grandpa_solo.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8099$path")
            echo "$path -> $code"
            test "$code" = "200" || { echo "expected 200 for $path"; exit 1; }
          done
          for path in /.git/config /Saved/Logs/PoSlapUnreal.log /AGENTS.md; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8099$path")
            echo "$path -> $code"
            test "$code" != "200" || { echo "$path must not be served"; exit 1; }
          done

      # ---- Build & deploy ----

      - name: Bundle static site (version stamp, /diag check list validated)
        run: python Web/build.py

      - name: Deploy to Azure Static Web Apps
        id: deploy
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POSLAP_ARENA }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: Web/dist
          skip_app_build: true
          skip_api_build: true

      - name: Check the live page and /diag
        if: steps.deploy.outcome == 'success'
        env:
          URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          stamp=$(grep -o 'id="stamp">[0-9]*' Web/dist/Web/index.html | grep -o '[0-9]*$')
          for i in $(seq 1 20); do
            page=$(curl -fsS --max-time 30 "$URL/Web/" || true)
            diag=$(curl -fsS --max-time 30 "$URL/diag" || true)
            root=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/")
            if [ "$root" = "200" ] && echo "$page" | grep -q "id=\"stamp\">$stamp<" \
               && echo "$diag" | grep -q "<title>System status</title>" && echo "$diag" | grep -q "id=\"stamp\">$stamp<"; then
              echo "Live: $URL (/ $root, /Web/ and /diag carry v$stamp)"; exit 0
            fi
            sleep 15
          done
          echo "$URL did not serve v$stamp at / and /diag"; exit 1
