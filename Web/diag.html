<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<!-- served at /diag (a rewrite) and /Web/diag.html: every relative URL below resolves against the game's folder -->
<base href="/Web/">
<meta name="po-commit" content="dev">   <!-- Web/build.py writes the commit this build came from -->
<title>System status</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M0 0h8v16H0z%22 fill=%22%23e5554c%22/%3E%3Cpath d=%22M8 0h8v16H8z%22 fill=%22%235d8cf0%22/%3E%3C/svg%3E">
<script type="importmap">
{ "imports": {
  "@mujoco/mujoco": "./node_modules/@mujoco/mujoco/mujoco.js",
  "onnxruntime-web": "./node_modules/onnxruntime-web/dist/ort.min.mjs"
} }
</script>
<style>
  :root { --po-bg: #0b0f17; --po-surface: #121826; --po-text: #e6e9f2; --po-muted: #9aa3b5; --po-accent: #6366f1;
    --po-ok-soft: rgb(52 168 98 / .22); --po-warn-soft: rgb(234 179 8 / .22); --po-bad-soft: rgb(239 68 68 / .24);
    --po-ok: #4ade80; --po-warn: #facc15; --po-bad: #f87171; --po-rule: rgb(255 255 255 / .08);
    --po-font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--po-bg); color: var(--po-text); font: 14px/1.5 var(--po-font); }
  .po-bar { position: sticky; top: 0; z-index: 2; height: calc(44px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0;
    display: flex; align-items: center; justify-content: space-between; background: var(--po-surface); border-bottom: 1px solid var(--po-rule); }
  .po-bar a { color: var(--po-text); text-decoration: none; font-weight: 700; font-size: 16px; }
  .po-bar a.back { font-weight: 500; font-size: 14px; color: var(--po-text); }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px calc(40px + env(safe-area-inset-bottom)); display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 22px; }
  h2 { margin: 8px 0 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--po-muted); }
  .banner { padding: 14px 16px; border-radius: 10px; background: var(--po-surface); border: 1px solid var(--po-rule); font-weight: 600; }
  .banner.ok { background: var(--po-ok-soft); } .banner.warn { background: var(--po-warn-soft); } .banner.bad { background: var(--po-bad-soft); }
  .banner small { display: block; font-weight: 400; color: var(--po-text); opacity: .85; }
  .rows { display: grid; gap: 8px; }
  .row { background: var(--po-surface); border: 1px solid var(--po-rule); border-radius: 10px; padding: 12px 14px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; }
  .row .label { font-weight: 600; }
  .row .purpose, .row .detail { grid-column: 1 / -1; color: var(--po-muted); font-size: 13px; overflow-wrap: anywhere; }
  .row .detail { color: var(--po-text); opacity: .9; }
  .banner a { color: #a5b4fc; }
  .row .ms { color: var(--po-muted); font-variant-numeric: tabular-nums; font-size: 13px; min-width: 5ch; text-align: right; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--po-rule); color: var(--po-text); }
  .pill.Healthy { background: var(--po-ok-soft); } .pill.Degraded { background: var(--po-warn-soft); } .pill.Unhealthy { background: var(--po-bad-soft); }
  .po-foot { position: fixed; left: 0; right: 0; bottom: 0; height: calc(20px + env(safe-area-inset-bottom)); padding: 0 12px env(safe-area-inset-bottom);
    display: flex; justify-content: space-between; align-items: center; background: var(--po-bg); font-size: 12px; line-height: 20px; color: var(--po-muted); }
  @media (max-width: 480px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .ms { grid-column: 2; grid-row: 2; } }
</style>
</head>
<body>
<header class="po-bar"><a href="/Web/">PoSlap Arena</a><a class="back" href="/Web/">Back to the arena</a></header>
<main>
  <h1>System status</h1>
  <div class="banner" id="banner" role="status">Checking every dependency…</div>
  <section><h2>API</h2><div class="rows" id="g-api"></div></section>
  <section><h2>Data</h2><div class="rows" id="g-data"></div></section>
  <section><h2>Services</h2><div class="rows" id="g-services"></div></section>
</main>
<footer class="po-foot"><span id="checked">–</span><span>v<span id="stamp">dev</span></span></footer>
<script type="module">
// Every row is a live probe from this browser (nothing is assumed): the list is Web/diag_checks.json.
const STAMP = document.getElementById("stamp").textContent.trim();
const LFS = "version https://git-lfs";
const now = () => performance.now();

async function get(url, kind = "bytes") {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  if (kind === "text") return r.text();
  if (kind === "json") return r.json();
  const b = new Uint8Array(await r.arrayBuffer());
  if (!b.length) throw new Error(`${url}: empty`);
  if (new TextDecoder().decode(b.subarray(0, 24)) === LFS) throw new Error(`${url}: an unpulled git-LFS pointer`);
  return b;
}
const mb = n => `${(n / 1e6).toFixed(1)} MB`;

async function files(urls) {
  const out = await Promise.allSettled(urls.map(u => get(u)));
  const bad = out.map((r, i) => (r.status === "rejected" ? urls[i] : null)).filter(Boolean);
  const size = out.reduce((s, r) => s + (r.status === "fulfilled" ? r.value.length : 0), 0);
  if (bad.length === urls.length) throw new Error(`none of ${urls.length} files load (${bad.slice(0, 3).join(", ")})`);
  return { status: bad.length ? "Degraded" : "Healthy", detail: bad.length ? `${urls.length - bad.length}/${urls.length} files; missing: ${bad.join(", ")}`
    : `${urls.length} files, ${mb(size)}` };
}

async function matchupFiles(part) {
  const { MATCHUPS } = await import("./loader.js");
  const urls = new Set();
  for (const mu of Object.values(MATCHUPS)) {
    const dir = mu.dir ?? "";
    if (part === "arenas") urls.add(`../training/models/${dir}${mu.xml}`);
    for (const c of mu.corners) {
      if (part === "brains") urls.add(`../training/models/brains/${c.brain}.onnx`);
      if (part === "bodies") { urls.add(`../training/models/${dir}${c.char}_fingerprint.json`); urls.add(`../training/characters/${c.char}.json`); }
    }
  }
  return files([...urls]);
}

const PROBES = {
  fetch: async c => { const b = await get(c.url); return { status: "Healthy", detail: `${c.url.split("/").pop()}, ${mb(b.length)}` }; },
  files: c => files(c.urls),
  matchups: c => matchupFiles(c.part),
  wasm: async c => { const b = await get(c.url); await WebAssembly.compile(b); return { status: "Healthy", detail: `compiled, ${mb(b.length)}` }; },
  mujoco: async c => {
    const loadMujoco = (await import("@mujoco/mujoco")).default;
    const mj = await loadMujoco();
    const m = mj.MjModel.from_xml_string(await get(c.arena, "text"));
    const d = new mj.MjData(m);
    for (let i = 0; i < 100; i++) mj.mj_step(m, d);
    const ok = Number.isFinite(d.qpos[2]);
    const ver = typeof mj.mj_versionString === "function" ? mj.mj_versionString() : "";
    return { status: ok ? "Healthy" : "Unhealthy", detail: `MuJoCo ${ver} - ${m.nbody} bodies, 100 steps ${ok ? "finite" : "NOT finite"}` };
  },
  onnx: async c => {
    const ort = await import("onnxruntime-web");
    ort.env.wasm.wasmPaths = new URL("./node_modules/onnxruntime-web/dist/", document.baseURI).href;
    ort.env.wasm.numThreads = 1;
    const s = await ort.InferenceSession.create(await get(c.brain));
    const n = Number(s.inputMetadata?.[0]?.shape?.[1]) || 136;
    const t0 = now();
    const out = (await s.run({ [s.inputNames[0]]: new ort.Tensor("float32", new Float32Array(n), [1, n]) }))[s.outputNames[0]];
    const ms = now() - t0;
    const ok = Array.from(out.data).every(Number.isFinite);
    return { status: ok ? "Healthy" : "Unhealthy", detail: `${c.brain.split("/").pop()}: ${n} inputs -> ${out.data.length} outputs, one decision ${ms.toFixed(1)} ms` };
  },
  webgl2: async () => {
    const gl = document.createElement("canvas").getContext("webgl2");
    if (!gl) throw new Error("this browser has no WebGL2 context (the arena cannot render)");
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    return { status: "Healthy", detail: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.VERSION) };
  },
  external: async c => {
    // a third-party service the game page loads (it falls back when it is down: Degraded, not Unhealthy)
    try {
      const r = await fetch(c.url, { cache: "no-store" });
      if (!r.ok) return { status: "Degraded", detail: `HTTP ${r.status} (the page falls back to ${c.fallback})` };
      const body = await r.text();
      if (c.expect && !body.includes(c.expect)) return { status: "Degraded", detail: `unexpected response (no "${c.expect}")` };
      return { status: "Healthy", detail: `${new URL(c.url).host}, ${body.length} bytes` };
    } catch (e) {
      return { status: "Degraded", detail: `${new URL(c.url).host} unreachable (the page falls back to ${c.fallback})` };
    }
  },
  commit: async c => {
    // the host stamps every response with X-Commit (Web/build.py -> staticwebapp.config.json): it must be the commit
    // this page was built from
    const r = await fetch(c.url, { method: "HEAD", cache: "no-store" });
    if (!r.ok) throw new Error(`${c.url}: HTTP ${r.status}`);
    const live = r.headers.get("x-commit"), built = document.querySelector('meta[name="po-commit"]').content;
    if (!live) throw new Error("no X-Commit header (only the deployed site sends it)");
    if (built && built !== "dev" && live !== built) return { status: "Degraded", detail: `X-Commit ${live.slice(0, 7)}, this page was built from ${built.slice(0, 7)}` };
    return { status: "Healthy", detail: `commit ${live.slice(0, 7)}` };
  },
  version: async c => {
    const html = await get(c.url, "text");
    const v = (html.match(/id=.stamp.>([^<]*)</) || [])[1] || "?";
    return v === STAMP ? { status: "Healthy", detail: `game page and status page: v${v}` }
      : { status: "Degraded", detail: `game page v${v}, status page v${STAMP} (a stale cache or a half-finished deploy)` };
  },
};

function row(c) {
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = `<span class="label"></span><span class="ms">…</span><span class="pill">Checking</span><span class="purpose"></span><span class="detail"></span>`;
  el.querySelector(".label").textContent = c.label;
  el.querySelector(".purpose").textContent = c.purpose || "";
  document.getElementById(`g-${c.group}`).append(el);
  return el;
}

async function run(c, el) {
  const t0 = now();
  let res;
  try { res = await PROBES[c.probe](c); } catch (e) { res = { status: "Unhealthy", detail: "", problem: String(e?.message || e) }; }
  res.ms = now() - t0;
  el.querySelector(".ms").textContent = `${Math.round(res.ms)} ms`;
  const pill = el.querySelector(".pill");
  pill.textContent = res.status; pill.className = `pill ${res.status}`;
  el.querySelector(".detail").textContent = res.problem || res.detail || "";
  return { ...c, ...res };
}

// Results are cached for CACHE_S in this tab (sessionStorage, keyed by the build), so a reload within a minute does not
// download the 50 MB of runtimes, brains and assets again; "Re-check" (?fresh on this page's own path, since the base
// is /Web/) probes again. Every probe is a GET or HEAD of a static file on the Free-tier host (plus Google Fonts' CSS):
// nothing billable.
const CACHE_S = 60, CACHE_KEY = `poslap-diag:${document.querySelector('meta[name="po-commit"]').content}:${STAMP}`;
function show(c, res) {   // a cached result, drawn like a fresh one
  const el = row(c);
  el.querySelector(".ms").textContent = `${Math.round(res.ms)} ms`;
  const pill = el.querySelector(".pill");
  pill.textContent = res.status; pill.className = `pill ${res.status}`;
  el.querySelector(".detail").textContent = res.problem || res.detail || "";
  return { ...c, ...res };
}
const banner = document.getElementById("banner");
const t0 = now();
let checks;
try { checks = (await get("diag_checks.json", "json")).checks; }
catch (e) { banner.className = "banner bad"; banner.textContent = `Not working: the check list could not load (${e.message})`; throw e; }
let cached = null;
try { cached = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "null"); } catch { cached = null; }
const age = cached ? (Date.now() - cached.at) / 1000 : Infinity;
const useCache = !new URLSearchParams(location.search).has("fresh") && age >= 0 && age < CACHE_S
  && cached.results?.length === checks.length && cached.results.every((r, i) => r.id === checks[i].id);
const results = useCache ? checks.map((c, i) => show(c, cached.results[i])) : await Promise.all(checks.map(c => run(c, row(c))));
if (!useCache) {
  try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), results: results.map(r => ({ id: r.id, status: r.status, ms: r.ms, detail: r.detail, problem: r.problem })) })); }
  catch { /* storage off (private mode): no cache */ }
}
const bad = results.filter(r => r.status === "Unhealthy"), warn = results.filter(r => r.status === "Degraded");
banner.className = `banner ${bad.length ? "bad" : warn.length ? "warn" : "ok"}`;
banner.textContent = bad.length ? `Not working: ${bad.map(r => r.label).join(", ")}`
  : warn.length ? `Working, with ${warn.length} thing${warn.length > 1 ? "s" : ""} degraded` : "Everything is working";
const small = document.createElement("small");
small.textContent = (useCache ? `${results.length} checks, cached ${Math.round(age)} s ago (kept ${CACHE_S} s)`
  : `${results.length} checks in ${Math.round(now() - t0)} ms`) + ` · build v${STAMP} · `;
const again = document.createElement("a");
again.href = `${location.pathname}?fresh`; again.textContent = "Re-check";
small.append(again);
banner.append(small);
document.getElementById("checked").textContent = `checked ${new Date(useCache ? cached.at : Date.now()).toLocaleTimeString()}`;
document.body.dataset.status = bad.length ? "Unhealthy" : warn.length ? "Degraded" : "Healthy";
</script>
</body>
</html>
