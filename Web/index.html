<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PoSlap Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D arena, broadcast HUD in the corners, transport bar at the bottom */
:root {
  --bg: #0b0b0d; --panel: rgb(14 14 18 / .78); --ink: #f2f0ea; --ink-2: #b8b6ad; --rule: rgb(255 255 255 / .12);
  --red: #e5554c; --blue: #5d8cf0; --gold: #f1c24b;
  --display: "Anton", Impact, "Arial Narrow", sans-serif; --body: "Public Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--body); overflow: hidden; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; pointer-events: none; padding: 12px 14px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; backdrop-filter: blur(6px); }
.top-left { top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); display: grid; gap: 4px; min-width: 220px; }
.top-right { top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: grid; gap: 6px; }
.brand { font-family: var(--display); font-size: 28px; letter-spacing: .02em; line-height: 1; }
.brand b { color: var(--red); font-weight: 400; } .brand i { color: var(--blue); font-style: normal; }
.round { font: 600 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.turn { font-weight: 700; font-size: 16px; }
.turn .red { color: var(--red); } .turn .blue { color: var(--blue); }
.clock { font: 500 13px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.strike { font: 500 13px var(--mono); color: var(--gold); min-height: 1.4em; }
.call { font-weight: 600; min-height: 1.4em; }
table { border-collapse: collapse; font: 500 12px var(--mono); font-variant-numeric: tabular-nums; }
th, td { padding: 2px 8px; text-align: right; } th { color: var(--ink-2); font-weight: 500; text-align: left; }
td.r { color: var(--red); } td.b { color: var(--blue); }
.series { font: 600 12px var(--mono); color: var(--ink-2); }
.tape { display: grid; gap: 2px; font: 500 11px var(--mono); color: var(--ink-2); }
.tape b { font-family: var(--body); font-size: 12px; } .tape .r { color: var(--red); } .tape .b { color: var(--blue); }
.banner { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; padding: 14px 28px; }
.banner.on { opacity: 1; }
.banner .big { font-family: var(--display); font-size: clamp(36px, 7vw, 72px); line-height: 1; text-transform: uppercase; }
.banner .small { font-weight: 600; color: var(--ink-2); margin-top: 6px; }
.bar { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
.bar button { font: 600 13px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 5px; padding: 7px 12px; cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.bar button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.matchups { left: 50%; transform: translateX(-50%); top: max(12px, env(safe-area-inset-top)); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; pointer-events: auto; padding: 6px; max-width: calc(100% - 32px); }
.matchups a { color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 13px; padding: 6px 10px; border-radius: 5px; border: 1px solid var(--rule); }
.matchups a[aria-current="true"] { background: var(--ink); color: var(--bg); }
.matchups a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.matchups .note { flex-basis: 100%; text-align: center; font-size: 12px; color: var(--gold); }
@media (max-width: 900px) { .matchups { top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 52px); } }
.stamp { position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); font: 500 11px var(--mono); color: var(--ink-2); }
.loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; background: var(--bg); z-index: 5; }
.loading .big { font-family: var(--display); font-size: 40px; }
@media (max-width: 640px) { .top-right { display: none; } .top-left { min-width: 0; } }
@media (prefers-reduced-motion: reduce) { .banner { transition: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/",
  "@mujoco/mujoco": "./node_modules/@mujoco/mujoco/mujoco.js",
  "onnxruntime-web": "./node_modules/onnxruntime-web/dist/ort.min.mjs"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div class="loading" id="loading"><div class="big">POSLAP</div><div id="loadmsg">Loading physics and brains…</div></div>

<div class="hud top-left" aria-live="polite">
  <div class="brand"><b>PO</b>SL<i>AP</i></div>
  <div class="round" id="round">Round 1 / 3</div>
  <div class="turn" id="turn">–</div>
  <div class="clock" id="clock">clock 30.0 s</div>
  <div class="strike" id="strike"></div>
  <div class="call" id="call"></div>
</div>

<nav class="hud matchups" id="matchup" aria-label="Matchup"></nav>

<div class="hud top-right">
  <div class="tape" id="tape"></div>
  <table aria-label="Judges' cards"><thead><tr><th>Judge</th><th>Red</th><th>Blue</th></tr></thead><tbody id="cards"></tbody></table>
  <div class="series" id="series">Series 0 – 0</div>
</div>

<div class="hud banner" id="banner"><div class="big" id="bannerBig"></div><div class="small" id="bannerSmall"></div></div>

<div class="bar" role="toolbar" aria-label="Playback">
  <button id="pause" aria-pressed="false">Pause</button>
  <button data-speed="0.25" aria-pressed="false">¼×</button>
  <button data-speed="1" aria-pressed="true">1×</button>
  <button data-speed="2" aria-pressed="false">2×</button>
  <button id="cam">Camera</button>
  <button id="phys" aria-pressed="false">Physics</button>
</div>
<div class="stamp">261025</div>
<script type="module" src="./app.js"></script>
</body>
</html>
